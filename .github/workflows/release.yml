# A release, started by hand (Actions → Release → Run workflow) from main once
# CI has passed on it: sets the version, commits and tags it, builds the
# server and the CLI for Linux and the CLI for Apple silicon, pushes them to
# the mdr-taxa Cachix cache, and publishes a GitHub release. Adopting a
# release is separate: a machine's config pins github:mdr/taxa/vX.Y.Z.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, X.Y.Z (no v)"
        required: true

permissions:
  contents: write

concurrency: release

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the version and that CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Release from main"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be X.Y.Z"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "::error::$TAG exists"; exit 1; }
          last=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "${last#v}" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION isn't after $last"; exit 1
          fi
          ci=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion -q '.[0].conclusion')
          [ "$ci" = success ] || { echo "::error::CI hasn't passed on $GITHUB_SHA (${ci:-not run})"; exit 1; }
      - name: Write the release notes
        run: |
          last=$(git tag --list 'v*' --sort=-version:refname | head -1)
          range=${last:+$last..}HEAD
          {
            echo "## Upgrading"
            echo
            migrations=$(git diff --name-only --diff-filter=A ${last:+$last} HEAD -- packages/server/drizzle/*.sql 2>/dev/null || true)
            [ -z "$last" ] && migrations=$(git ls-files 'packages/server/drizzle/*.sql')
            if [ -n "$migrations" ]; then
              echo "- **Migrates the database**: the server runs these as it starts, and they only go forwards. To roll back, restore the dump \`services.taxa\` takes before a new package first starts."
              # shellcheck disable=SC2016 # backticks and $ are sed's, not the shell's
              echo "$migrations" | sed 's/^/  - `/; s/$/`/'
            else
              echo "- No database migrations."
            fi
            if [ -n "$last" ] && ! git diff --quiet "$last" HEAD -- nix/module.nix nix/dump-before-upgrade.nix; then
              echo "- **\`services.taxa\` changed**: see \`git diff $last $TAG -- nix/\`."
            fi
            echo
            echo "## Installing"
            echo
            echo "Pin \`github:mdr/taxa/$TAG\`: \`packages.<system>.taxa\` is the CLI, \`nixosModules.default\` the server (\`services.taxa\`). Built results are in the \`mdr-taxa\` Cachix cache (\`https://mdr-taxa.cachix.org\`, key \`mdr-taxa.cachix.org-1:tHW34mvFiWUUPwC1vjS+FQji6A7HvH9u/bOVbpW+OEI=\`)."
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
          } > release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
      - name: Set the version, commit and tag
        id: commit
        run: |
          for file in package.json packages/*/package.json; do
            sed -i -E "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$VERSION\"/" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            packages: .#taxa-server .#taxa
          - runner: macos-latest
            packages: .#taxa
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v17
        with:
          name: mdr-taxa
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      # Only the packages' closures: cachix leaves out what cache.nixos.org has.
      - name: Build and push to Cachix
        run: nix build -L --print-out-paths ${{ matrix.packages }} | cachix push mdr-taxa

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md --verify-tag
